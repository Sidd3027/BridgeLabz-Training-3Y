<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Theme Switcher</title>
<style>body{font:16px Arial;margin:30px;padding:20px;transition:background .2s,color .2s}body.light{background:#fff;color:#222}body.dark{background:#222;color:#f5f5f5}body.blue{background:#dceeff;color:#073763}button{padding:10px;margin:5px}</style></head>
<body class="light" data-theme="light"><h1>Theme Switcher</h1><p>Choose a theme:</p><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button><button data-theme-choice="blue">Blue</button>
<script src="q4_theme_switcher.js"></script></body></html>
