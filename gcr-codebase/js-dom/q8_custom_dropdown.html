<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom Dropdown</title>
<style>body{font:16px Arial;margin:30px}.dropdown{position:relative;display:inline-block}.options{position:absolute;top:100%;left:0;min-width:180px;border:1px solid #aaa;background:white;box-shadow:0 3px 8px #0002;z-index:1}.options[hidden]{display:none}.options button{display:block;width:100%;padding:10px;text-align:left;border:0;background:white;cursor:pointer}.options button:hover{background:#eee}#dropdownButton{padding:10px 16px}</style></head>
<body><h1>Custom Dropdown</h1><div class="dropdown" id="dropdown"><button id="dropdownButton" type="button" aria-expanded="false">Choose an option ▾</button><div class="options" id="dropdownOptions" hidden><button type="button">Option One</button><button type="button">Option Two</button><button type="button">Option Three</button></div></div>
<script src="q8_custom_dropdown.js"></script></body></html>
