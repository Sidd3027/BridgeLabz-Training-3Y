<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Information Form</title></head>
<body>
    <h1>Student Information</h1>
    <form action="#" method="post">
        <label for="student-name">Name:</label><input type="text" id="student-name" name="name" required><br><br>
        <label for="roll-number">Roll Number:</label><input type="text" id="roll-number" name="rollNumber" required><br><br>
        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="" disabled selected>Select Course</option>
            <option value="BTech-CSE">B.Tech CSE</option><option value="BTech-IT">B.Tech IT</option><option value="BCA">BCA</option><option value="MCA">MCA</option>
        </select><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
