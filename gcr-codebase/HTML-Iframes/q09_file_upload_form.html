<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>File Upload Form</title></head>
<body>
    <h1>Upload an Image</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="image-file">Choose image:</label>
        <input type="file" id="image-file" name="imageFile" accept=".jpg,.png,image/jpeg,image/png" required>
        <p>Allowed file types: JPG and PNG images only.</p>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
