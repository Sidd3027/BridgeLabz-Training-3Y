<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title sets the text shown in the browser tab. -->
    <title>Important HTML Head Elements</title>
    <!-- charset declares the character encoding. -->
    <meta charset="UTF-8">
    <!-- description summarizes the page for search results. -->
    <meta name="description" content="A demonstration of important HTML head elements.">
    <!-- author identifies the page author. -->
    <meta name="author" content="Student">
    <!-- base sets the base URL used by relative links. -->
    <base href="https://example.com/">
    <!-- link connects an external resource, such as a favicon. -->
    <link rel="icon" href="favicon.ico">
    <!-- style can contain page-specific CSS; left empty as requested. -->
    <style></style>
    <!-- script can contain or reference JavaScript; left empty as requested. -->
    <script></script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page demonstrates the main elements that can be placed inside the HTML head section.</p>
    <p><a href="about">Example relative link using the base URL</a></p>
</body>
</html>
