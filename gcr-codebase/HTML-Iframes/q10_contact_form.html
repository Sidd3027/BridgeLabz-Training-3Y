<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Form</title></head>
<body>
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <label for="contact-name">Full Name:</label><input type="text" id="contact-name" name="fullName" placeholder="Enter your full name" required><br><br>
        <label for="contact-email">Email:</label><input type="email" id="contact-email" name="email" placeholder="Enter your email" required><br><br>
        <label for="subject">Subject:</label><input type="text" id="subject" name="subject" placeholder="Enter a subject" required><br><br>
        <label for="message">Message:</label><br><textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message" required></textarea><br><br>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
