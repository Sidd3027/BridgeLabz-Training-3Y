<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feedback Form</title></head>
<body>
    <h1>Share Your Feedback</h1>
    <form method="post" action="#">
        <label for="feedback">Your feedback:</label><br><textarea id="feedback" name="feedback" rows="5" cols="40" required></textarea>
        <fieldset><legend>Rate your experience</legend>
            <input type="radio" id="good" name="rating" value="Good" required><label for="good">Good</label>
            <input type="radio" id="average" name="rating" value="Average"><label for="average">Average</label>
            <input type="radio" id="poor" name="rating" value="Poor"><label for="poor">Poor</label>
        </fieldset>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
