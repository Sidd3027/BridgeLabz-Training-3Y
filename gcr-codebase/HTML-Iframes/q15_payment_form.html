<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment Form</title></head>
<body>
    <h1>Payment Details</h1>
    <!-- Demonstration form only: never collect real card data without a secure payment provider. -->
    <form action="#" method="post">
        <label for="cardholder">Cardholder Name:</label><input type="text" id="cardholder" name="cardholder" autocomplete="cc-name" required><br><br>
        <label for="card-number">Card Number:</label><input type="text" id="card-number" name="cardNumber" inputmode="numeric" autocomplete="cc-number" required><br><br>
        <label for="expiry">Expiry Date:</label><input type="month" id="expiry" name="expiry" autocomplete="cc-exp" required><br><br>
        <label for="cvv">CVV:</label><input type="password" id="cvv" name="cvv" inputmode="numeric" autocomplete="cc-csc" required><br><br>
        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
