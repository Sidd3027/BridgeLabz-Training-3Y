<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>URI Encoding Example</title></head>
<body>
    <h1>URI Encoding</h1>
    <p>Original query text: HTML &amp; CSS</p>
    <p>Encoded URL uses %20 for spaces and %26 for the ampersand:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS</a>
</body>
</html>
