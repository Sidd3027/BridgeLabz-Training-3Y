<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Form Security Attributes</title></head>
<body>
    <h1>Secure Form Example</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="security-username">Username:</label><input type="text" id="security-username" name="username" required><br><br>
        <label for="security-email">Email:</label><input type="email" id="security-email" name="email" required><br><br>
        <label for="security-password">Password:</label><input type="password" id="security-password" name="password" required><br><br>
        <button type="submit">Submit</button>
    </form>
    <p>Turning off autocomplete can reduce the chance that sensitive values are saved or suggested on a shared device. It does not replace server-side security.</p>
</body>
</html>
