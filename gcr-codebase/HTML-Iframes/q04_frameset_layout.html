<!DOCTYPE html>
<!-- frameset/frame are obsolete in HTML5 but included because this assignment specifically requests them. -->
<html lang="en">
<head><meta charset="UTF-8"><title>Frameset Layout</title></head>
<frameset rows="25%,75%">
    <frame src="navigation.html" title="Navigation links">
    <frame src="welcome.html" name="content" title="Welcome message">
    <noframes><body>Your browser does not support frames.</body></noframes>
</frameset>
</html>
