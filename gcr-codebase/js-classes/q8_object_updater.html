<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dynamic Object Updater</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:16px}label,input{display:block;width:100%;box-sizing:border-box;margin:8px 0}input{padding:9px}button{padding:9px 14px}pre{background:#f2f2f2;padding:12px;white-space:pre-wrap}</style></head>
<body><h1>Edit User</h1><form id="userForm">
<label>Name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>Age <input name="age" type="number" min="1" required></label>
<button type="submit">Update User</button></form><h2>Updated Object</h2><pre id="userDetails"></pre>
<script src="q8_dynamic_object_updater.js"></script></body></html>
