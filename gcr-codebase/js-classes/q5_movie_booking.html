<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Movie Ticket Booking</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:16px}label,input{display:block;width:100%;box-sizing:border-box;margin:8px 0}input{padding:9px}button{padding:9px 14px}pre{white-space:pre-wrap}</style></head>
<body><h1>Movie Ticket Booking</h1><form id="bookingForm">
<label>Name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>Seats (1–10) <input name="seats" type="number" min="1" max="10" required></label>
<button type="submit">Book Tickets</button></form><pre id="bookingResult" aria-live="polite"></pre>
<script src="q5_movie_ticket_booking.js"></script></body></html>
