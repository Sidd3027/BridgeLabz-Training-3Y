<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typography</title>
    <link rel="stylesheet" href="responsive_typography.css">
</head>
<body>
    <main class="reading-panel">
        <p class="eyebrow">DESIGN NOTES</p>
        <h1>Good ideas deserve room to breathe</h1>
        <p>Responsive typography adjusts to the screen so a page remains readable on a phone, tablet or desktop. The clamp() function sets a minimum, a preferred fluid size and a maximum value.</p>

    </main>
