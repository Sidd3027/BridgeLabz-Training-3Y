<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards</title>
    <link rel="stylesheet" href="responsive_cards_media_queries.css">
</head>
<body>
    <header><h1>Four Ways to Grow</h1><p>Resize the browser to see the cards rearrange.</p></header>
    <main class="card-grid">
        <article class="card"><span>01</span><h2>Curiosity</h2><p>Ask questions and look for new connections.</p></article>
        <article class="card"><span>02</span><h2>Practice</h2><p>Repeat the basics until they feel natural.</p></article>
        <article class="card"><span>03</span><h2>Patience</h2><p>Give challenging ideas time to make sense.</p></article>
        <article class="card"><span>04</span><h2>Reflection</h2><p>Notice what worked and what can improve.</p></article>
    </main>
</body>
</html>
