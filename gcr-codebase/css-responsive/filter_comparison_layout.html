<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
    <header><h1>One Scene, Two Looks</h1><p>Compare an original image with a filtered version.</p></header>
    <main class="comparison">
        <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Lake with hills in natural colour"><figcaption>Original image</figcaption></figure>
        <figure class="filtered"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="The same lake image with increased contrast"><figcaption>Filtered image — contrast</figcaption></figure>
    </main>
</body>
</html>
