<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
    <header><h1>Colour & Light Gallery</h1><p>Each photograph starts with a different CSS filter. Hover to reveal its original look.</p></header>
    <main class="gallery">
        <figure class="blur"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Lake surrounded by mountains"><figcaption>Blur</figcaption></figure>
        <figure class="gray"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Sunlight through a forest"><figcaption>Grayscale</figcaption></figure>
        <figure class="sepia"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Warm open landscape"><figcaption>Sepia</figcaption></figure>
        <figure class="bright"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Lake and green hills"><figcaption>Brightness</figcaption></figure>
        <figure class="contrast"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Mountain peaks"><figcaption>Contrast</figcaption></figure>
        <figure class="hue"><img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=700&q=80" alt="Wildlife in a meadow"><figcaption>Hue rotation</figcaption></figure>
    </main>
    <footer><p>Responsive gallery · CSS filters</p></footer>
</body>
</html>
