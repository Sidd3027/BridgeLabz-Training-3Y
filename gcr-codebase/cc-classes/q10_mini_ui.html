<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini UI Layout</title>
    <link rel="stylesheet" href="q10_mini_ui.css">
</head>
<body>
    <header class="topbar"><a href="#home">Little Steps</a><span>Student workspace</span></header>
    <main id="home">
        <section class="profile-card">
            <div class="card-image"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=700&q=80" alt="Laptop on a desk"></div>
            <div class="card-content">
                <p class="eyebrow">YOUR NEXT TASK</p>
                <h1>Plan a study session</h1>
                <p class="description">Choose a topic and set a small goal for your next focused study block.</p>
                <form>
                    <label for="topic">Topic</label>
                    <input id="topic" type="text" placeholder="e.g. CSS selectors">
                    <label for="duration">Study duration</label>
                    <select id="duration">
                        <option>25 minutes</option>
                        <option>45 minutes</option>
                        <option>60 minutes</option>
                    </select>
                    <div class="form-actions"><button type="submit">Save plan</button><button type="reset" class="secondary">Reset</button></div>
                </form>
            </div>
        </section>
    </main>
    <footer><p>Made for practice · Keep learning one step at a time.</p></footer>
</body>
</html>
