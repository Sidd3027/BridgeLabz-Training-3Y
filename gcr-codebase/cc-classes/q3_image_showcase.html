<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3_image_showcase.css">
</head>
<body>
    <header><h1>Places to Pause</h1><p>A small gallery of landscapes and quiet corners.</p></header>
    <main class="gallery">
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Mountain lake"></div><figcaption>Mountain Lake</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Sunlit landscape"></div><figcaption>Open Landscape</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Sunlight in a forest"></div><figcaption>Forest Path</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Snowy mountain peaks"></div><figcaption>High Peaks</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Lake surrounded by hills"></div><figcaption>Still Water</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=700&q=80" alt="Wildlife in a green field"></div><figcaption>Wild Meadow</figcaption></figure>
    </main>
    <footer><p>Gallery made with HTML and CSS only.</p></footer>
</body>
</html>
