<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <link rel="stylesheet" href="q5_buttons.css">
</head>
<body>
    <main class="button-page">
        <h1>Button Collection</h1>
        <p>Each button style gives a different kind of feedback.</p>
        <div class="button-row">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
            <button class="btn outline">Outline</button>
            <button class="btn disabled" disabled>Disabled</button>
        </div>
        <p class="hint">Use Tab to move focus between the enabled buttons.</p>
    </main>
</body>
</html>
