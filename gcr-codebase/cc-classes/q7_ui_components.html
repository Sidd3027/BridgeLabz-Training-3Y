<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Panel</title>
    <link rel="stylesheet" href="q7_ui_components.css">
</head>
<body>
    <main class="component-card">
        <p class="eyebrow">WORKSPACE TOOLS</p>
        <h1>Find what you need</h1>
        <label for="search">Search resources</label>
        <input id="search" type="search" placeholder="Search lessons or notes">
        <label for="category">Choose a category</label>
        <select id="category">
            <option>All resources</option>
            <option>Study notes</option>
            <option>Practice tests</option>
            <option>Projects</option>
        </select>
        <div class="actions"><button type="button">Search</button><button type="button" class="quiet">Clear filters</button></div>
        <p class="small-note">A compact interface built using CSS only.</p>
    </main>
</body>
</html>
