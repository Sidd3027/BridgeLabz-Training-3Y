<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Gallery</title>
    <link rel="stylesheet" href="q2_tooltips.css">
</head>
<body>
    <header><h1>Tooltip Gallery</h1><p>Hover over each label to reveal a helpful note.</p></header>
    <main class="tooltip-row">
        <span class="tip-wrap">HTML <span class="tooltip">Structures webpage content</span></span>
        <span class="tip-wrap">CSS <span class="tooltip">Controls the visual presentation</span></span>
        <span class="tip-wrap">Grid <span class="tooltip">Creates rows and columns</span></span>
        <span class="tip-wrap">Flexbox <span class="tooltip">Aligns items along an axis</span></span>
    </main>
</body>
</html>
