<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact_form.css">
</head>
<body>
<main class="contact-page"><section class="contact-card"><h1>Contact Us</h1><p>Have a question or idea? Send us a message.</p><form action="#" method="post"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required placeholder="Your name"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" required placeholder="How can we help?"></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5" required placeholder="Write your message..."></textarea></div><button type="submit">Send Message</button></form></section></main>
</body>
</html>
