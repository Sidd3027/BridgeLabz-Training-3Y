<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="q3_gradients.css">
</head>
<body>
    <header class="fixed-header"><h1>Colour in Motion</h1></header>
    <main>
        <section class="gradient-section linear">
            <div class="message"><h2>Linear Gradient</h2><p>Colours blend in a direction, from one side to another.</p></div>
        </section>
        <section class="gradient-section radial">
            <div class="message"><h2>Radial Gradient</h2><p>The colour spreads outward from a central point.</p></div>
        </section>
    </main>
    <footer class="fixed-footer">CSS gradients demonstration</footer>
</body>
</html>
