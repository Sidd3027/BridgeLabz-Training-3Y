<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="q9_focus_form.css">
</head>
<body>
    <main class="form-card">
        <h1>Send a Note</h1>
        <p>Fill in the fields to see the focus outline.</p>
        <form>
            <label for="student-name">Your name</label>
            <input id="student-name" type="text" placeholder="Enter your name">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="name@example.com">
            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Write a short message"></textarea>
            <button type="submit">Submit form</button>
        </form>
        <p class="note">Click or tab into a field to view its outline.</p>
    </main>
</body>
</html>
