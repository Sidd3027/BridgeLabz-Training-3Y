<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="q6_transforms.css">
</head>
<body>
    <header><h1>Transformation Playground</h1><p>Hover over each tile to see its movement.</p></header>
    <main class="transform-row">
        <section class="example"><div class="tile rotate">A</div><p>rotate(12deg)</p></section>
        <section class="example"><div class="tile scale">B</div><p>scale(1.15)</p></section>
        <section class="example"><div class="tile translate">C</div><p>translateY(-14px)</p></section>
        <section class="example"><div class="tile skew">D</div><p>skew(-10deg)</p></section>
    </main>
</body>
</html>
