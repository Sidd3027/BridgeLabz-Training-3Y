<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="q4_shadows.css">
</head>
<body>
    <header><h1>People Who Inspire</h1><p>Three card styles made with CSS shadows.</p></header>
    <main class="cards">
        <article class="card soft">
            <div class="avatar">A</div><h2>Aarav</h2>
            <p>Enjoys solving problems and learning new tools.</p>
        </article>
        <article class="card sharp">
            <div class="avatar">M</div><h2>Meera</h2>
            <p>Likes visual design and building simple websites.</p>
        </article>
        <article class="card glow">
            <div class="avatar">K</div><h2>Kabir</h2>
            <p>Explores technology through small daily projects.</p>
        </article>
    </main>
</body>
</html>
