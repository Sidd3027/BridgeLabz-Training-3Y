<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Dashboard</title>
  <link rel="stylesheet" href="q4_dashboard_grid.css">
</head>
<body>
  <div class="dashboard">
    <header class="topbar"><h1>Dashboard</h1><span>Welcome back!</span></header>
    <aside class="sidebar"><h2>Menu</h2><a href="#overview">Overview</a><a href="#analytics">Analytics</a><a href="#reports">Reports</a><a href="#settings">Settings</a></aside>
    <main class="content" id="overview">
      <article class="tile wide"><h2>Overview</h2><p>Your key information at a glance.</p></article>
      <article class="tile" id="analytics"><h2>Analytics</h2><p>Review recent activity and trends.</p></article>
      <article class="tile" id="reports"><h2>Reports</h2><p>Explore your latest reports.</p></article>
      <article class="tile" id="settings"><h2>Settings</h2><p>Manage your preferences.</p></article>
    </main>
  </div>
</body>
</html>
