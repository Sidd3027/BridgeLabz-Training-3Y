<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="q8_photo_gallery.css">
</head>
<body>
  <main class="gallery-page">
    <h1>Places & Moments</h1>
    <section class="gallery">
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape"></div><figcaption>Mountain Escape</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80" alt="Ocean waves"></div><figcaption>Ocean Breeze</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Lake surrounded by mountains"></div><figcaption>Quiet Lake</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a forest"></div><figcaption>Forest Walk</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks"></div><figcaption>Snowy Peaks</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise over a field"></div><figcaption>Golden Sunrise</figcaption></figure>
    </section>
  </main>
</body>
</html>
