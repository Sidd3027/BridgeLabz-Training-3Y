<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="q9_card_flip.css">
</head>
<body>
  <main class="flip-page">
    <h1>Discover the Card</h1>
    <div class="card-scene">
      <article class="flip-card">
        <section class="card-face card-front">
          <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Sunlit mountain valley">
          <h2>Explore Nature</h2>
          <p>Hover over this card to flip it.</p>
        </section>
        <section class="card-face card-back">
          <h2>Take a Break</h2>
          <p>Nature gives us space to pause, recharge, and notice the small details around us.</p>
        </section>
      </article>
    </div>
  </main>
</body>
</html>
